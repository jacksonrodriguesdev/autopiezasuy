<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AUTO PIEZAS UY">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a72"/>
      <stop offset="1" stop-color="#0b1f3f"/>
    </linearGradient>
    <linearGradient id="laranja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e85a0c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <!-- engrenagem -->
  <g transform="translate(256 236)" fill="url(#laranja)">
    <g id="dente">
      <rect x="-26" y="-176" width="52" height="60" rx="10"/>
    </g>
    <use href="#dente" transform="rotate(45)"/>
    <use href="#dente" transform="rotate(90)"/>
    <use href="#dente" transform="rotate(135)"/>
    <use href="#dente" transform="rotate(180)"/>
    <use href="#dente" transform="rotate(225)"/>
    <use href="#dente" transform="rotate(270)"/>
    <use href="#dente" transform="rotate(315)"/>
    <circle r="132"/>
  </g>
  <circle cx="256" cy="236" r="96" fill="#0f2850"/>
  <!-- iniciais -->
  <text x="256" y="272" text-anchor="middle" font-family="'Plus Jakarta Sans','Arial Black',Arial,sans-serif"
        font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-4">AP</text>
  <!-- faixa UY -->
  <rect x="146" y="408" width="220" height="56" rx="28" fill="#ffffff"/>
  <text x="256" y="448" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif"
        font-size="40" font-weight="800" fill="#0f2850" letter-spacing="6">UY</text>
</svg>
